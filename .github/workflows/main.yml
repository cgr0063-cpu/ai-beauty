name: Update package lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update lock
        working-directory: ai-beauty
        run: npm install --package-lock-only

      - name: Commit lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-beauty/package-lock.json
          git diff --cached --quiet || git commit -m "Update package lock"
          git push
