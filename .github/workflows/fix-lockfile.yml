name: Fix package-lock (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync package-lock.json only
        working-directory: ai-beauty
        run: npm install --package-lock-only

      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-beauty/package-lock.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: sync package-lock.json"
          git push
