name: Android Diagnostic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE_URL: https://ai-beauty-9msu.onrender.com
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 1070221768961-be8hng16458sbskdakvstnsr959ttccq.apps.googleusercontent.com
      EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: goog_AQMFMsnJHOYtnFwsrbKifzBQYwi
      EAS_PROJECT_ID: e73fe7a7-6a61-472a-96d3-f88468b3339a

    defaults:
      run:
        working-directory: ai-beauty

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-beauty/package-lock.json

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo doctor
        run: npx expo-doctor@latest

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-beauty-diagnostic-apk
          path: ai-beauty/android/app/build/outputs/apk/release/*.apk
