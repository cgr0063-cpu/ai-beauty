name: Android Diagnostic APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ai-beauty

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-beauty/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Pull Expo production environment
        run: npx eas-cli@latest env:pull --environment production --non-interactive

      - name: Build production-parity APK locally
        run: |
          mkdir -p dist
          npx eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --local \
            --non-interactive \
            --output "$PWD/dist/ai-beauty-production.apk"

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$PWD/dist/ai-beauty-production.apk"

      - name: Inspect embedded Google client IDs
        run: |
          rm -rf apk-inspect
          mkdir apk-inspect
          unzip -q "$PWD/dist/ai-beauty-production.apk" -d apk-inspect
          grep -RhaoE '[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com' apk-inspect 2>/dev/null | sort -u -c || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-beauty-production-apk
          path: ai-beauty/dist/ai-beauty-production.apk
          retention-days: 7
