name: Android Production AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: ai-beauty

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai-beauty/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Pull Expo production environment
        run: npx eas-cli@latest env:pull --environment production --non-interactive

      - name: Set production Android version
        run: |
          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.android.versionCode = 22;
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");

          const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
          eas.cli = eas.cli || {};
          eas.cli.appVersionSource = "local";
          eas.build.production.environment = "production";
          eas.build.production.autoIncrement = false;
          fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2) + "\n");
          NODE

      - name: Build production AAB locally
        run: |
          mkdir -p dist
          npx eas-cli@latest build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$PWD/dist/ai-beauty-production.aab"

      - name: Upload production AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-beauty-production-aab
          path: ai-beauty/dist/ai-beauty-production.aab
          retention-days: 7
